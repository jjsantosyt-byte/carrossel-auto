# Roda sozinho no GitHub (grátis) e publica 3 carrosséis por dia.
# 06:00 BRT gera os 3 do dia; 08:00, 12:30 e 19:00 BRT publica um de cada vez.
# (horários do cron em UTC: BRT + 3h)
name: carrossel

on:
  schedule:
    - cron: "0 9 * * *"     # 06:00 BRT  -> gerar
    - cron: "0 11 * * *"    # 08:00 BRT  -> publicar
    - cron: "30 15 * * *"   # 12:30 BRT  -> publicar
    - cron: "0 22 * * *"    # 19:00 BRT  -> publicar
  workflow_dispatch:
    inputs:
      acao:
        description: "gerar ou publicar"
        default: "publicar"

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Instalar o ffmpeg (monta os Reels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Gerar os carrosséis do dia
        if: github.event.schedule == '0 9 * * *' || inputs.acao == 'gerar'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python gerar.py --qtd 3 --completar

      # O GitHub às vezes atrasa o horário das 06:00 em várias horas. Se a fila estiver
      # vazia na hora de publicar, gera um agora e salva, para o GitHub Pages servir as imagens.
      - name: Garantir que tem post na fila
        if: github.event.schedule != '0 9 * * *' && inputs.acao != 'gerar'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python gerar.py --qtd 1 --completar
          git config user.name "carrossel-bot"
          git config user.email "carrossel-bot@users.noreply.github.com"
          git add saida conteudo links
          if git commit -m "carrossel: fila vazia, gerado na hora"; then git push; fi

      - name: Publicar o próximo da fila
        if: github.event.schedule != '0 9 * * *' && inputs.acao != 'gerar'
        env:
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python publicar.py --proximo

      - name: Salvar no repositório (o GitHub Pages serve as imagens)
        if: always()
        run: |
          git config user.name "carrossel-bot"
          git config user.email "carrossel-bot@users.noreply.github.com"
          git add saida conteudo links
          git commit -m "carrossel: ${{ github.event.schedule || inputs.acao }}" || echo "nada novo"
          git push
