    - {titulo: "Erro 2: vídeo sem gancho", texto: "Se os 2 primeiros segundos não prendem, ninguém vê o produto."}
    - {titulo: "Erro 3: não mostrar uso", texto: "As pessoas compram quando veem o produto resolvendo um problema real."}
    - {titulo: "Erro 4: desistir cedo", texto: "Postar 5 vídeos e parar. O jogo começa depois de dezenas de testes."}
    - {titulo: "Erro 5: ignorar os números", texto: "Retenção e cliques mostram o que repetir. Quem não olha, chuta."}
  legenda: "Qual desses você já cometeu? Comenta aqui 👇"
  hashtags: "#tiktokshop #afiliadotiktok #vendernotiktok #dinheironainternet"

- hook: "Como escolher produtos que realmente vendem no TikTok Shop"
  slides:
    - {titulo: "Resolve um problema visível", texto: "Produtos que mostram antes e depois em segundos funcionam muito bem em vídeo."}
    - {titulo: "Preço de compra por impulso", texto: "Ticket baixo e médio: a pessoa decide na hora, sem pensar duas vezes."}
    - {titulo: "Já tem vídeos vendendo", texto: "Se outros criadores já vendem, existe demanda. Você só precisa do seu ângulo."}
    - {titulo: "Boa avaliação da loja", texto: "Loja com nota baixa gera reclamação e devolução. Isso queima sua conta."}
    - {titulo: "Comissão que vale a pena", texto: "Compare a comissão com o preço. Muitas vendas pequenas também somam."}
  legenda: "Manda pra quem quer começar como afiliado 🚀"
  hashtags: "#tiktokshop #produtosvirais #afiliado #achadinhos"

- hook: "O roteiro de vídeo que mais vende no TikTok Shop"
