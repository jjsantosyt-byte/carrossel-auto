    - {titulo: "Segundo 3 a 10: a prova", texto: "Mostre o produto funcionando de verdade, de perto, sem enrolação."}
    - {titulo: "Segundo 10 a 20: o detalhe", texto: "Um benefício que a pessoa não esperava. É aqui que ela decide comprar."}
    - {titulo: "Final: a chamada", texto: "Diga exatamente o que fazer: toque no carrinho laranja e garanta o seu."}
    - {titulo: "Repita o que funciona", texto: "Achou um formato que vende? Grave de novo com outro produto."}
  legenda: "Salva esse roteiro e testa no seu próximo vídeo 🎬"
  hashtags: "#tiktokshop #roteirodevideo #ugc #afiliadotiktok"

