# Banco de roteiros. Cada item vira um carrossel.
# hook = slide 1 (frase que para o scroll)
# slides = slides do meio (titulo + texto curto)
# legenda = texto da publicação (o nome do produto e "link na bio" entram sozinhos)
# produto = (opcional) nome exato do produto em config.yaml; sem ele, o roteiro serve para qualquer produto
# Tema: ganhar dinheiro como afiliado do TikTok Shop.
# Evite prometer valores de ganho: Instagram, TikTok e Kiwify punem promessa de dinheiro fácil.

- hook: "O que ninguém te conta antes de começar no TikTok Shop"
  slides:
    - {titulo: "Você não precisa de estoque", texto: "Como afiliado, você divulga produtos de outras lojas e ganha comissão por cada venda."}
    - {titulo: "Nem de muitos seguidores", texto: "Vídeo bom aparece pra quem não te segue. O algoritmo entrega pelo conteúdo, não pelo tamanho."}
    - {titulo: "Mas precisa de constância", texto: "Quem posta todo dia aprende mais rápido o que vende e o que não vende."}
    - {titulo: "Produto certo é metade", texto: "Escolher bem o que divulgar pesa mais que edição bonita."}
    - {titulo: "E de um método", texto: "Seguir um passo a passo testado economiza meses de tentativa e erro."}
  legenda: "Salva pra ler de novo antes de começar 📌"
  hashtags: "#tiktokshop #afiliado #rendaextra #vendasonline #tiktokshopbrasil"

- hook: "5 erros que travam suas vendas no TikTok Shop"
